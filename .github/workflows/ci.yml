name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, tests, build, auditoría y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests de lógica (Vitest)
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests e2e (Playwright)
        run: npm run e2e

      - name: Reporte de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Imagen Docker (solo build)
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen sin publicarla
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: devs-not-found:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
